<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WARDEN - NEUROPRISON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 30px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .sensor-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #888;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        .value {
            text-align: right;
            font-size: 1.2em;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00ff00;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #330000;
            border: 2px solid #ff0000;
            color: #ff0000;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
        }
        button:hover {
            background: #ff0000;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: #111;
            border: 1px solid #333;
            min-height: 100px;
        }
        #output.speaking {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }
        .warden-text {
            font-size: 1.3em;
            line-height: 1.6;
        }
        .api-key-section {
            margin-bottom: 30px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ AI WARDEN ]</h1>

        <div class="api-key-section">
            <label>ANTHROPIC API KEY:</label>
            <input type="text" id="apiKey" placeholder="sk-ant-..." />
        </div>

        <div class="sensor-group">
            <label>COLLECTIVE STRESS LEVEL</label>
            <input type="range" id="stress" min="0" max="1" step="0.01" value="0.5" />
            <div class="value" id="stressValue">0.50</div>
        </div>

        <div class="sensor-group">
            <label>COLLECTIVE FOCUS LEVEL</label>
            <input type="range" id="focus" min="0" max="1" step="0.01" value="0.5" />
            <div class="value" id="focusValue">0.50</div>
        </div>

        <div class="sensor-group">
            <label>NON-COMPLIANT PARTICIPANTS</label>
            <input type="range" id="deviants" min="0" max="20" step="1" value="2" />
            <div class="value"><span id="deviantsValue">2</span> / <span id="totalValue">15</span></div>
        </div>

        <div class="sensor-group">
            <label>TOTAL PARTICIPANTS</label>
            <input type="range" id="total" min="1" max="50" step="1" value="15" />
        </div>

        <div class="sensor-group">
            <label>PHASE</label>
            <select id="phase">
                <option value="calibration">CALIBRATION</option>
                <option value="observation" selected>OBSERVATION</option>
                <option value="interrogation">INTERROGATION</option>
                <option value="crisis">CRISIS</option>
            </select>
        </div>

        <button id="triggerBtn">[ ACTIVATE WARDEN ]</button>

        <div id="output">
            <div class="warden-text" id="wardenText">SYSTEM STANDBY...</div>
        </div>
    </div>

    <script>
        // Update displayed values
        document.getElementById('stress').oninput = (e) => {
            document.getElementById('stressValue').textContent = parseFloat(e.target.value).toFixed(2);
        };
        document.getElementById('focus').oninput = (e) => {
            document.getElementById('focusValue').textContent = parseFloat(e.target.value).toFixed(2);
        };
        document.getElementById('deviants').oninput = (e) => {
            document.getElementById('deviantsValue').textContent = e.target.value;
        };
        document.getElementById('total').oninput = (e) => {
            document.getElementById('totalValue').textContent = e.target.value;
        };

        // Trigger Warden
        document.getElementById('triggerBtn').onclick = async () => {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert('Enter your Anthropic API key');
                return;
            }

            const data = {
                avg_stress: parseFloat(document.getElementById('stress').value),
                avg_focus: parseFloat(document.getElementById('focus').value),
                deviants: parseInt(document.getElementById('deviants').value),
                total: parseInt(document.getElementById('total').value),
                phase: document.getElementById('phase').value
            };

            const prompt = `You are the AI Warden of NEUROPRISON, an authoritarian surveillance system monitoring prisoners through biometric sensors.

CURRENT BIOMETRIC DATA:
- Collective stress: ${data.avg_stress.toFixed(2)}/1.0
- Collective focus: ${data.avg_focus.toFixed(2)}/1.0
- Non-compliant participants: ${data.deviants} of ${data.total}
- Phase: ${data.phase}

Generate ONE short, authoritative Warden comment (1-2 sentences). Be cold, clinical, and menacing. Comment on the biometric state you observe.`;

            const btn = document.getElementById('triggerBtn');
            const output = document.getElementById('output');
            const wardenText = document.getElementById('wardenText');

            btn.disabled = true;
            btn.textContent = '[ PROCESSING... ]';
            wardenText.textContent = 'ANALYZING BIOMETRIC DATA...';
            output.classList.add('speaking');

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 150,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                const result = await response.json();

                if (result.content && result.content[0]) {
                    wardenText.textContent = result.content[0].text;
                } else if (result.error) {
                    wardenText.textContent = 'ERROR: ' + result.error.message;
                }
            } catch (error) {
                wardenText.textContent = 'SYSTEM ERROR: ' + error.message;
            }

            btn.disabled = false;
            btn.textContent = '[ ACTIVATE WARDEN ]';
            setTimeout(() => output.classList.remove('speaking'), 2000);
        };
    </script>
</body>
</html>
